[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Proxy all /api/* calls to the Render backend — eliminates CORS completely
[[redirects]]
  from = "/api/*"
  to = "https://researchflow-backend-zssy.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
