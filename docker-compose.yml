version: '3.8'

services:
  researchflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchflow-ai
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-20b}
      - PORT=8000
    volumes:
      - researchflow_data:/app/data
    restart: unless-stopped

volumes:
  researchflow_data:
